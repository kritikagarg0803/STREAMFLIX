<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StreamFlix - Lost Paradise</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #111;
            color: white;
        }

        .navbar {
            height: 70px;
            background-color: #000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;
        }

        .logo {
            color: #e50914;
            font-size: 30px;
            font-weight: bold;
        }

        .back-btn {
            background-color: #e50914;
            color: white;
            text-decoration: none;

            padding: 10px 20px;
            border-radius: 5px;
        }

        .back-btn:hover {
            background-color: #b20710;
        }

        .video-container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        video {
            width: 100%;
            max-height: 600px;
            background-color: black;
            border-radius: 8px;
        }

        .movie-details {
            margin-top: 25px;
        }

        .movie-details h1 {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .movie-info {
            display: flex;
            gap: 20px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .movie-details p {
            color: #bbb;
            line-height: 1.6;
            font-size: 16px;
        }

        footer {
            background-color: #000;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            color: #777;
        }

    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            STREAMFLIX
        </div>

        <a href="home.html" class="back-btn">
            ← Back
        </a>

    </nav>


    <div class="video-container">

        <video controls autoplay>

            <source
                src="https://www.w3schools.com/html/mov_bbb.mp4"
                type="video/mp4"
            >

            Your browser does not support video playback.

        </video>


        <div class="movie-details">

            <h1>Lost Paradise</h1>

            <div class="movie-info">
                <span>2026</span>
                <span>Adventure</span>
                <span>Nature</span>
                <span>HD</span>
            </div>

            <p>
                Explore the beauty of nature in Lost Paradise.
                Experience breathtaking landscapes, peaceful forests,
                mountains and beautiful natural surroundings.
            </p>

        </div>

    </div>


    <footer>

        <p>
            © 2026 StreamFlix. Front-End Web Development Project.
        </p>

    </footer>

</body>
</html>
